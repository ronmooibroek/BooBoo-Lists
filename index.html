<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#fbf6ed" />
<title>Our Lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  :root {
    --bg: #f7f1e8;
    --surface: #fffdf9;
    --ink: #2e2a25;
    --muted: #948a7e;
    --accent: #c75d3c;
    --accent-dark: #a8472b;
    --done: #8a9a73;
    --line: #ebe2d4;
    --shadow: 0 1px 2px rgba(46,42,37,.05), 0 8px 24px rgba(46,42,37,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Archivo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background: var(--bg);
    color: var(--ink);
    background-image: radial-gradient(circle at 12% 8%, rgba(199,93,60,.06), transparent 40%),
                      radial-gradient(circle at 90% 100%, rgba(138,154,115,.07), transparent 45%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 600px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- Sign-in screen ---------- */
  .signin {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 28px; gap: 8px;
  }
  .signin h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: 44px; margin: 0; letter-spacing: -.5px; }
  .signin p { color: var(--muted); margin: 0 0 24px; font-size: 16px; max-width: 280px; }
  .mark {
    width: 78px; height: 78px; border-radius: 22px; margin-bottom: 14px;
    background: var(--accent); color: #fff; display: grid; place-items: center;
    font-family: "Fraunces", serif; font-size: 38px; box-shadow: var(--shadow);
    transform: rotate(-4deg);
  }
  .gbtn {
    display: inline-flex; align-items: center; gap: 12px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    padding: 13px 22px; border-radius: 999px; font-size: 16px; font-weight: 500;
    font-family: inherit; box-shadow: var(--shadow); transition: transform .12s ease;
  }
  .gbtn:active { transform: scale(.97); }
  .gbtn svg { width: 19px; height: 19px; }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 22px 14px; padding-top: max(20px, env(safe-area-inset-top));
  }
  .brand { font-family: "Fraunces", serif; font-weight: 600; font-size: 27px; letter-spacing: -.4px; }
  .who { display: flex; align-items: center; gap: 9px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-weight: 600; font-size: 14px; flex-shrink: 0;
    background-size: cover; background-position: center; cursor: pointer;
  }
  .signout {
    background: none; border: none; color: var(--muted); font-family: inherit;
    font-size: 13px; cursor: pointer; padding: 6px; text-decoration: underline; text-underline-offset: 2px;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; gap: 6px; margin: 4px 18px 8px; padding: 5px;
    background: rgba(46,42,37,.04); border-radius: 14px;
  }
  .tab {
    flex: 1; min-width: 0; border: none; background: none; font-family: inherit; cursor: pointer;
    padding: 9px 5px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--muted);
    display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; transition: all .18s ease;
  }
  .tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .count {
    font-size: 11px; font-weight: 600; min-width: 17px; height: 18px; padding: 0 5px;
    border-radius: 999px; display: inline-grid; place-items: center;
    background: rgba(46,42,37,.07); color: var(--muted);
  }
  .tab.active .count { background: var(--accent); color: #fff; }

  /* ---------- List ---------- */
  main { flex: 1; padding: 6px 14px 130px; }
  .item {
    display: flex; align-items: center; gap: 13px; padding: 11px 14px; margin: 7px 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); animation: pop .22s ease both;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
  .check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line);
    flex-shrink: 0; margin-top: 1px; cursor: pointer; background: none; padding: 0;
    display: grid; place-items: center; transition: all .15s ease;
  }
  .check svg { width: 13px; height: 13px; opacity: 0; transform: scale(.5); transition: all .15s ease; color: #fff; }
  .item.done .check { background: var(--done); border-color: var(--done); }
  .item.done .check svg { opacity: 1; transform: scale(1); }
  .body { flex: 1; min-width: 0; }
  .body.qty-tap { cursor: pointer; user-select: none; -webkit-user-select: none; }
  .tqty { color: var(--muted); font-weight: 600; }
  .text { font-size: 18px; line-height: 1.35; word-break: break-word; }
  .item.done .text { text-decoration: line-through; color: var(--muted); }
  .meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .del {
    background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px;
    border-radius: 8px; flex-shrink: 0; line-height: 0; opacity: .55; transition: opacity .15s, color .15s;
  }
  .del:active { color: var(--accent); opacity: 1; }
  .del svg { width: 17px; height: 17px; }

  .row-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; align-self: center; }
  .store-chip {
    font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 6px 11px; border-radius: 999px; transition: transform .12s;
  }
  .store-chip.empty { color: var(--muted); font-weight: 500; }
  .store-chip:active { transform: scale(.93); }
  .act { background: none; border: none; cursor: pointer; color: var(--done); padding: 5px; border-radius: 8px; line-height: 0; opacity: .85; }
  .act svg { width: 19px; height: 19px; }
  .act.save:active { color: var(--accent); transform: scale(.9); }

  .suggest { margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .suggest-h { font-family: "Fraunces", serif; font-size: 18px; font-weight: 600; margin: 0 2px 11px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .schip {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 7px 7px 13px; font-family: inherit; font-size: 14px; color: var(--ink);
    box-shadow: var(--shadow); transition: transform .12s;
  }
  .schip:active { transform: scale(.95); }
  .sdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .sx { color: var(--muted); font-size: 18px; line-height: 1; padding: 0 4px; }
  .sx:active { color: var(--accent); }

  /* ---------- Long-press action sheet ---------- */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 60; background: rgba(46,42,37,.38);
    display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } }
  .sheet {
    width: 100%; max-width: 600px; background: var(--surface);
    border-radius: 22px 22px 0 0; padding: 8px 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    box-shadow: 0 -8px 40px rgba(46,42,37,.22);
    animation: sheetUp .25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  .sheet-title {
    text-align: center; font-weight: 600; color: var(--muted); font-size: 14px;
    padding: 12px 8px 8px; word-break: break-word;
  }
  .sheet-act {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--bg); border: none; border-radius: 14px; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 500; color: var(--ink);
    padding: 15px 18px; margin: 7px 0; text-align: left;
  }
  .sheet-act:active { filter: brightness(.96); }
  .sheet-act svg { width: 21px; height: 21px; flex-shrink: 0; }
  .sheet-act.keep svg { color: var(--done); }
  .sheet-act.danger, .sheet-act.danger svg { color: #c0392b; }
  .sheet-cancel {
    width: 100%; background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 600; color: var(--muted);
    padding: 15px; margin-top: 2px;
  }

  /* ---------- Store filter bar ---------- */
  .filter-bar { display: flex; align-items: center; gap: 10px; padding: 4px 2px 10px; }
  .filter-pill { color: #fff; font-size: 13px; font-weight: 600; padding: 6px 13px; border-radius: 999px; }
  .filter-clear {
    margin-left: auto; background: none; border: none; cursor: pointer; color: var(--muted);
    font-family: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; padding: 6px;
  }

  /* ---------- Task sheet controls ---------- */
  .sheet-section { background: var(--bg); border-radius: 14px; padding: 12px 14px; margin: 7px 0; }
  .sheet-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
  .people { display: flex; flex-wrap: wrap; gap: 8px; }
  .person {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-family: inherit;
    font-size: 14px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 7px 13px;
  }
  .person.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .pdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .due-row { display: flex; align-items: center; gap: 10px; }
  .due-input {
    flex: 1; font-family: inherit; font-size: 15px; padding: 9px 11px;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
  }
  .due-clear { background: none; border: none; color: var(--muted); font-family: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .repeat-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; color: var(--ink); }
  .rep-input {
    width: 56px; font-family: inherit; font-size: 15px; padding: 8px; text-align: center;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
  }
  .rep-modes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 11px; }
  .rep-mode {
    font-family: inherit; font-size: 13px; cursor: pointer; background: var(--surface);
    border: 1.5px solid var(--line); color: var(--ink); border-radius: 999px; padding: 7px 12px;
  }
  .rep-mode.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .rep-off { color: var(--muted); font-size: 14px; }
  .weekday-row { display: flex; gap: 6px; }
  .wd {
    flex: 1; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--surface); border: 1.5px solid var(--line); color: var(--ink);
    border-radius: 10px; padding: 9px 0;
  }
  .wd.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .m-assignee { display: inline-flex; align-items: center; gap: 5px; }
  .m-due { color: var(--muted); }
  .m-due.overdue { color: #c0392b; font-weight: 600; }
  .m-rep { color: var(--muted); }

  .avt {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
    background-size: cover; background-position: center; overflow: hidden;
    display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700;
  }
  .avt.big { width: 46px; height: 46px; font-size: 18px; }
  .avt.lg { width: 32px; height: 32px; font-size: 14px; }
  .gthumb { width: 40px; height: 40px; border-radius: 9px; background-size: cover; background-position: center; flex-shrink: 0; }
  .sheet-photo { display: block; width: 100%; max-width: 300px; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px; margin: 6px auto 12px; }

  /* ---------- Recipes ---------- */
  .recipe-row { cursor: pointer; }
  .recipe-row .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .chev { color: var(--muted); font-size: 22px; margin-left: 8px; flex-shrink: 0; }
  .recipe-head { display: flex; align-items: center; gap: 12px; padding: 4px 2px 14px; flex-wrap: wrap; }
  .back-btn { background: none; border: none; color: var(--accent); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; padding: 4px 0; }
  .recipe-title { font-family: "Fraunces", serif; font-size: 22px; font-weight: 600; width: 100%; }
  .ing-check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: none;
    flex-shrink: 0; cursor: pointer; padding: 0; position: relative;
  }
  .ing-row.sel .ing-check { background: var(--accent); border-color: var(--accent); }
  .ing-row.sel .ing-check::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 700; position: absolute; inset: 0; display: grid; place-items: center; }
  .ing-row.sel .text { font-weight: 600; }
  .recipe-add-btn {
    display: block; width: 100%; margin: 18px 0 8px; padding: 15px; border: none; border-radius: 14px;
    background: var(--accent); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .recipe-add-btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .recipe-add-btn:not(:disabled):active { background: var(--accent-dark); }

  /* Recipe detail / cookbook */
  .recipe-actions { display: flex; gap: 10px; margin: 0 0 14px; }
  .recipe-serves { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--ink); font-size: 15px; margin: -4px 2px 16px; }
  .rs-label { font-weight: 600; color: var(--muted); }
  .rs-step { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
  .rs-btn { width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--bg); color: var(--ink); font-size: 19px; font-weight: 700; line-height: 1; cursor: pointer; display: grid; place-items: center; }
  .rs-btn:active { transform: scale(.92); }
  .rs-n { min-width: 26px; text-align: center; font-weight: 700; font-size: 16px; }
  .rs-link { border: none; background: none; color: var(--accent); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 2px; }
  .rc-section-h { font-family: "Fraunces", serif; font-size: 19px; font-weight: 600; margin: 18px 2px 8px; }
  .step-row { display: flex; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .step-num { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .step-text { line-height: 1.45; }
  .recipe-cover { display: block; width: 100%; max-height: 240px; object-fit: cover; border-radius: 16px; margin: 0 0 14px; cursor: pointer; }
  .step-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
  .step-img { width: 100%; max-width: 240px; border-radius: 12px; object-fit: cover; }
  .cook-photo { width: 100%; max-width: 360px; max-height: 40vh; object-fit: cover; border-radius: 16px; margin-bottom: 20px; }
  .step-edit { width: 100%; font-family: inherit; font-size: 16px; line-height: 1.45; border: 1.5px solid var(--accent); border-radius: 10px; padding: 9px 11px; background: var(--surface); color: var(--ink); resize: none; outline: none; }
  .add-step { color: var(--accent); font-weight: 600; font-size: 15px; padding: 12px 4px; cursor: pointer; }
  .rc-btn { flex: 1; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .rc-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rc-btn.primary:active { background: var(--accent-dark); }

  /* Import overlay */
  .overlay { position: fixed; inset: 0; z-index: 60; background: rgba(46,42,37,.4); display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .2s ease; }
  .overlay-card { width: 100%; max-width: 600px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 18px; padding-bottom: max(16px, env(safe-area-inset-bottom)); box-shadow: 0 -8px 40px rgba(46,42,37,.22); animation: sheetUp .25s cubic-bezier(.2,.8,.2,1); max-height: 92vh; overflow-y: auto; }
  .overlay-title { font-family: "Fraunces", serif; font-size: 22px; font-weight: 600; }
  .overlay-sub { color: var(--muted); font-size: 14px; margin: 6px 0 12px; line-height: 1.4; }
  .import-text { width: 100%; min-height: 170px; resize: vertical; font-family: inherit; font-size: 15px; line-height: 1.4; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
  .import-status { font-size: 13px; color: var(--muted); min-height: 18px; margin-top: 8px; }
  .overlay-btns { display: flex; gap: 10px; margin-top: 12px; }
  .overlay-cancel { width: 100%; background: none; border: none; color: var(--muted); font-family: inherit; font-size: 15px; font-weight: 600; padding: 14px; cursor: pointer; margin-top: 4px; }

  /* Cooking mode */
  .cook { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; overflow-y: auto; padding: 30px 24px; text-align: center; }
  .cook > .cook-title { margin-top: auto; }
  .cook > .cook-nav { margin-bottom: auto; }
  .cook-close { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; }
  .cook-title { font-family: "Fraunces", serif; font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .cook-counter { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 26px; }
  .cook-step { font-size: 26px; line-height: 1.4; max-width: 520px; }
  .cook-nav { display: flex; gap: 12px; margin-top: 36px; width: 100%; max-width: 420px; }
  .cook-btn { flex: 1; padding: 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-family: inherit; font-size: 16px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .cook-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cook-btn:disabled { opacity: .4; cursor: default; }
  .taskline { display: flex; align-items: center; gap: 10px; }
  .taskline .ttext { flex: 1; min-width: 0; word-break: break-word; }
  .inline-av { margin-left: auto; }
  .profile-row { display: flex; align-items: center; gap: 13px; }
  .profile-name { flex: 1; font-size: 16px; font-weight: 500; }
  .profile-btn {
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px;
    padding: 8px 15px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer;
  }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty .em-mark { font-size: 40px; margin-bottom: 8px; }
  .clear-done {
    display: block; margin: 16px auto 0; background: none; border: none; cursor: pointer;
    color: var(--muted); font-family: inherit; font-size: 13px; padding: 8px 14px;
    border-radius: 999px; text-decoration: underline; text-underline-offset: 2px;
  }
  .upcoming { margin-top: 20px; }
  .upcoming-head {
    display: flex; align-items: center; gap: 9px; width: 100%; cursor: pointer;
    background: none; border: none; border-top: 1px dashed var(--line);
    padding: 16px 2px 12px; font-family: inherit;
  }
  .up-title { font-family: "Fraunces", serif; font-size: 18px; font-weight: 600; color: var(--ink); }
  .up-count { font-size: 12px; font-weight: 600; background: rgba(46,42,37,.07); color: var(--muted); border-radius: 999px; padding: 2px 8px; }
  .up-chev { margin-left: auto; color: var(--muted); font-size: 13px; }

  /* ---------- Add bar ---------- */
  .addbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 12px 14px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, rgba(247,241,232,0));
  }
  .addinner {
    max-width: 600px; margin: 0 auto; display: flex; gap: 9px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 7px 7px 7px 16px; box-shadow: 0 4px 24px rgba(46,42,37,.1);
  }
  .addinner input {
    flex: 1; border: none; outline: none; background: none; font-family: inherit;
    font-size: 16px; color: var(--ink); padding: 8px 0;
  }

  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function fileToAvatar(file, size, cb) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = size; c.height = size;
        const ctx = c.getContext("2d");
        const scale = Math.max(size / img.width, size / img.height); // cover crop
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        cb(c.toDataURL("image/jpeg", 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  function nextWeekday(weekday, fromISO) {
    const d = new Date(fromISO + "T00:00:00");
    while (d.getDay() !== weekday) d.setDate(d.getDate() + 1);
    return isoOf(d);
  }
  function nextDom(dom, fromISO) {
    const d = new Date(fromISO + "T00:00:00");
    for (let i = 0; i < 370; i++) {
      const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); // days in this month
      if (d.getDate() === Math.min(dom, dim)) return isoOf(d);
      d.setDate(d.getDate() + 1);
    }
    return isoOf(d);
  }

    if (t === "interval") return it.repeatDays > 0;
    if (t === "weekly") return Number.isInteger(it.repeatWeekday);
    if (t === "monthly") return it.repeatDom >= 1;
    return false;
  }
  function nextDue(it, fromISO) {
    const t = it.repeatType || (it.repeatDays > 0 ? "interval" : "");
    if (t === "interval") return addDays(fromISO, it.repeatDays || 1);
    if (t === "weekly") return nextWeekday(it.repeatWeekday || 0, fromISO);
    if (t === "monthly") return nextDom(it.repeatDom || 1, fromISO);
    return "";
  }
  function repeatLabel(it) {
    const t = it.repeatType || (it.repeatDays > 0 ? "interval" : "");

    if (t === "weekly" && Number.isInteger(it.repeatWeekday)) return "↻ " + WD_SHORT[it.repeatWeekday];
    if (t === "monthly" && it.repeatDom >= 1) return "↻ " + ordinal(it.repeatDom);
    return "";
  }

    // Group active items by store, alphabetical within each, collapsible
    const groups = {};
    for (const it of active) { const k = it.store || ""; (groups[k] = groups[k] || []).push(it); }

      const items = groups[store].sort((a, b) => (a.text || "").localeCompare(b.text || "", undefined, { sensitivity: "base" }));

  function renderTasks(task, list) {
    const today = todayISO();
    const notDone = task.filter((i) => !i.done);
    const overdue = notDone.filter((i) => i.due && i.due < today)
      .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0));
    const active = notDone.filter((i) => !i.due || i.due === today)
      .sort((a, b) => orderOf(a) - orderOf(b));
    const doneArr = task.filter((i) => i.done);
    const futureArr = notDone.filter((i) => i.due && i.due > today)
      .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0));

    if (overdue.length === 0 && active.length === 0 && doneArr.length === 0 && futureArr.length === 0) {
      list.innerHTML = `<div class="empty"><div class="em-mark">🌿</div>Nothing here yet.<br>Add the first item below.</div>`;
      return;
    }

    // What-needs-attention banner
    const todayCount = active.filter((i) => i.due === today).length;
    if (overdue.length || todayCount) {
      const banner = document.createElement("div");
      banner.className = "due-banner";
      const parts = [];
      if (overdue.length) parts.push(`<b>${overdue.length}</b> overdue`);
      if (todayCount) parts.push(`<b>${todayCount}</b> due today`);
      banner.innerHTML = `<span class="db-dot"></span><span>${parts.join(" · ")}</span>`;
      list.appendChild(banner);
    }

    // Overdue first, pinned (time-driven, not part of manual priority order)
    for (const it of overdue) list.appendChild(taskRow(it, false));

    // Priority list: no-due + due-today, drag to reorder
    const sortWrap = document.createElement("div");
    sortWrap.className = "sortable";
    for (const it of active) sortWrap.appendChild(taskRow(it, true));
    list.appendChild(sortWrap);
    makeSortable(sortWrap);

    if (overdue.length === 0 && active.length === 0 && doneArr.length === 0) {
      const note = document.createElement("div");
      note.className = "empty"; note.style.padding = "26px 20px";
      note.innerHTML = `Nothing due right now 🌿`;
      list.appendChild(note);
    }

    for (const it of doneArr) list.appendChild(taskRow(it, false));

    if (doneArr.length) {
      const btn = document.createElement("button");
      btn.className = "clear-done";
      btn.textContent = "Clear completed";
      btn.onclick = () => deleteMany(doneArr);
      list.appendChild(btn);
    }

    if (futureArr.length) {
      const wrap = document.createElement("div");
      wrap.className = "upcoming";
      const head = document.createElement("button");
      head.className = "upcoming-head";
      head.innerHTML = `<span class="up-title">Upcoming</span><span class="up-count"></span><span class="up-chev">${upcomingOpen ? "▾" : "▸"}</span>`;
      head.querySelector(".up-count").textContent = futureArr.length;
      head.onclick = () => { upcomingOpen = !upcomingOpen; render(); };
      wrap.appendChild(head);
      if (upcomingOpen) for (const it of futureArr) wrap.appendChild(taskRow(it, false));
      list.appendChild(wrap);
    }
  }

  const FRAC_UNI = { "½": 0.5, "⅓": 1/3, "⅔": 2/3, "¼": 0.25, "¾": 0.75, "⅕": 0.2, "⅖": 0.4, "⅗": 0.6, "⅘": 0.8, "⅙": 1/6, "⅚": 5/6, "⅛": 0.125, "⅜": 0.375, "⅝": 0.625, "⅞": 0.875 };
  const UNI_CLASS = "½⅓⅔¼¾⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞";
  const parseServings = (s) => { const m = String(s || "").match(/\d+/); return m ? parseInt(m[0], 10) : null; };
  function qtyToNum(tok) {
    tok = tok.trim(); let m;
    if ((m = tok.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return (+m[1]) + (+m[2]) / (+m[3]);
    if ((m = tok.match(/^(\d+)\/(\d+)$/))) return (+m[1]) / (+m[2]);
    if ((m = tok.match(new RegExp("^(\\d+)\\s*([" + UNI_CLASS + "])$")))) return (+m[1]) + FRAC_UNI[m[2]];
    if (FRAC_UNI[tok] != null) return FRAC_UNI[tok];
    if (/^\d+(?:\.\d+)?$/.test(tok)) return +tok;
    return null;
  }
  function fmtQty(n) {
    if (!isFinite(n) || n <= 0) return "0";
    const whole = Math.floor(n + 1e-9), frac = n - whole;
    if (frac <= 0.03) return String(whole);
    if (Math.abs(frac - 1) <= 0.04) return String(whole + 1);
    const FR = [[.125, "⅛"], [.25, "¼"], [1/3, "⅓"], [.375, "⅜"], [.5, "½"], [.625, "⅝"], [2/3, "⅔"], [.75, "¾"], [.875, "⅞"]];
    let best = null, bd = 1;
    for (const [v, s] of FR) { const d = Math.abs(frac - v); if (d < bd) { bd = d; best = s; } }
    if (bd <= 0.05) return whole > 0 ? (whole + best) : best;
    return String(Math.round(n * 100) / 100);
  }
  function scaleIngredient(str, factor) {
    if (!factor || factor === 1) return str;
    const V = "(\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+\\s*[" + UNI_CLASS + "]|[" + UNI_CLASS + "]|\\d+(?:\\.\\d+)?)";
    const re = new RegExp("^\\s*" + V + "(?:\\s*[-–]\\s*" + V + ")?");
    const m = str.match(re);
    if (!m) return str;
    const n1 = qtyToNum(m[1]); if (n1 == null) return str;
    let out = fmtQty(n1 * factor);
    if (m[2]) { const n2 = qtyToNum(m[2]); if (n2 != null) out += "–" + fmtQty(n2 * factor); }
    return out + str.slice(m[0].length);
  }

  function parseRecipe(text) {
    const lines = text.replace(/\r/g, "").split("\n").map((l) => l.trim()).filter((l) => l.length);
    let title = lines[0] || "Recipe";
    let servings = "";
    const sv = text.match(/\b(?:serves|serving|yield|yields|makes)\b[:\s]*([0-9]+(?:\s*(?:-|–|to)\s*[0-9]+)?)/i);
    if (sv) servings = sv[1].replace(/\s+/g, " ");
    const isIngHdr = (l) => /^ingredients?\b/i.test(l) && l.length < 28;
    const isStepHdr = (l) => /^(directions?|method|instructions?|steps?|preparation)\b/i.test(l) && l.length < 28;
    // A notes header is the word Note(s)/Tip(s) alone on a line, or followed by a colon.
    const isNotesHdr = (l) => /^(notes?|tips?)\s*:?\s*$/i.test(l) || /^(notes?|tips?)\s*:\s*\S/i.test(l);
    let ingStart = -1, stepStart = -1, notesStart = -1;
    lines.forEach((l, idx) => {
      if (isIngHdr(l) && ingStart === -1) ingStart = idx;
      else if (isStepHdr(l) && ingStart !== -1 && stepStart === -1) stepStart = idx;
      else if (isNotesHdr(l) && notesStart === -1 && idx > 0) notesStart = idx;
    });

    let notes = "";
    if (notesStart !== -1) {
      const headTail = lines[notesStart].replace(/^(notes?|tips?)\s*:?\s*/i, "").trim();
      const rest = lines.slice(notesStart + 1).map((l) => l.replace(/^[-•*▢]\s*/, "")).join("\n").trim();
      notes = [headTail, rest].filter(Boolean).join("\n").trim();
    }
    const bodyEnd = notesStart !== -1 ? notesStart : lines.length;

    let ingredients = [], steps = [];
    if (ingStart !== -1) {
      const before = lines.slice(0, ingStart);
      if (before.length) title = before[0];
      const ingEnd = (stepStart > ingStart) ? stepStart : bodyEnd;
      ingredients = lines.slice(ingStart + 1, ingEnd);
      if (stepStart !== -1) steps = lines.slice(stepStart + 1, bodyEnd);
    } else {
      const unit = /\b(cups?|tbsp|tablespoons?|tsp|teaspoons?|g|grams?|kg|oz|ounces?|lb|pounds?|ml|l|litres?|liters?|cloves?|pinch|cans?|pkg|packages?|slices?|sticks?)\b/i;
      for (const l of lines.slice(1, bodyEnd)) {
        const looksIng = (/^[\d¼½¾⅓⅔⅛⅜⅝⅞]/.test(l) || unit.test(l)) && l.length < 80;
        if (looksIng) ingredients.push(l); else steps.push(l);
      }
    }
    const strip = (s) => s.replace(/^\s*\d+[\.\)]\s*/, "").replace(/^[-•*▢]\s*/, "").trim();
    ingredients = ingredients.map(strip).filter(Boolean);
    steps = steps.map(strip).filter(Boolean);
    if (isIngHdr(title) || isStepHdr(title)) title = "Recipe";
    return { title: title.slice(0, 80), servings, ingredients, steps, notes };
  }

  // ---- Cook-mode step timer ----
  function parseStepSeconds(text) {
    if (!text) return 0;
    const t = String(text).toLowerCase();
    const re = /(\d+(?:\.\d+)?)(?:\s*(?:-|–|—|to)\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|hr|h|minutes?|mins?|min|m|seconds?|secs?|sec|s)\b/g;
    let secs = 0, matched = false, mm;
    while ((mm = re.exec(t))) {
      const lo = parseFloat(mm[1]);
      const hi = mm[2] ? parseFloat(mm[2]) : lo;
      const val = Math.max(lo, hi); // use the generous end of a range
      const u = mm[3];
      const mult = /^h/.test(u) ? 3600 : /^m/.test(u) ? 60 : 1;
      secs += val * mult;
      matched = true;
    }
    return matched ? Math.round(secs) : 0;
  }
  function fmtTime(s) {
    s = Math.max(0, Math.round(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    const p = (n) => String(n).padStart(2, "0");
    return h > 0 ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;
  }
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }
  function beep(freq, start, dur, vol) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    const t0 = audioCtx.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.03);
    alarmNodes.push(o);
    o.onended = () => { alarmNodes = alarmNodes.filter((n) => n !== o); };
  }
  function playAlarm() {
    ensureAudio();
    if (!audioCtx) return;
    let t = 0;
    for (let r = 0; r < 6; r++) { // ~6s of a rising 3-note chime
      beep(880, t, 0.18, 0.32);
      beep(1175, t + 0.2, 0.18, 0.32);
      beep(1568, t + 0.4, 0.3, 0.32);
      t += 1.0;
    }
    try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 600]); } catch (e) {}
  }
  function stopAlarm() {
    alarmNodes.forEach((o) => { try { o.stop(); } catch (e) {} });
    alarmNodes = [];
    try { navigator.vibrate && navigator.vibrate(0); } catch (e) {}
  }
  function setupTimer(secs) {
    stopAlarm(); ctStopTick();
    ctState = { base: secs, remaining: secs, running: false, done: false, endTime: 0, tick: null };
    const box = $("cookTimer");
    if (secs > 0) { box.style.display = "flex"; ctRender(); }
    else { box.style.display = "none"; }
  }
  function ctRender() {
    $("ctTime").textContent = fmtTime(ctState.remaining);
    $("cookTimer").classList.toggle("ringing", ctState.done);
    $("ctToggle").textContent = ctState.done ? "Dismiss" : (ctState.running ? "Pause" : "Start");
  }
  function ctStartTick() {
    ctStopTick();
    ctState.tick = setInterval(() => {
      const rem = Math.round((ctState.endTime - Date.now()) / 1000);
      ctState.remaining = Math.max(0, rem);
      if (rem <= 0) ctFire();
      ctRender();
    }, 250);
  }
  function ctStopTick() { if (ctState.tick) { clearInterval(ctState.tick); ctState.tick = null; } }
  function ctFire() {
    ctStopTick();
    ctState.running = false; ctState.remaining = 0; ctState.done = true;
    playAlarm(); ctRender();
  }
  function ctToggle() {
    if (ctState.done) { ctReset(); return; }
    if (ctState.running) {
      ctState.running = false;
      ctState.remaining = Math.max(0, Math.round((ctState.endTime - Date.now()) / 1000));
      ctStopTick();
    } else {
      if (ctState.remaining <= 0) ctState.remaining = ctState.base;
      if (ctState.remaining <= 0) return;
      ensureAudio();
      ctState.running = true;
      ctState.endTime = Date.now() + ctState.remaining * 1000;
      ctStartTick();
    }
    ctRender();
  }
  function ctAdjust(delta) {
    stopAlarm();
    ctState.done = false;
    ctState.remaining = Math.max(0, ctState.remaining + delta);
    if (ctState.remaining === 0) { ctState.running = false; ctStopTick(); }
    else if (ctState.running) { ctState.endTime = Date.now() + ctState.remaining * 1000; }
    ctRender();
  }
  function ctReset() {
    stopAlarm(); ctStopTick();
    ctState.running = false; ctState.done = false;

    ctRender();
  }

        if (val === "") {
          it.repeatType = ""; it.repeatDays = 0;
          updateDoc(doc(db, "items", it.id), { repeatType: "", repeatDays: 0, hiddenUntil: "" });
        }
        renderRepeatDetail(val);
      };
      modesEl.appendChild(b);
    });
    renderRepeatDetail(selType);
    acts.appendChild(rWrap);

    // Save + Delete side by side (changes apply instantly; Save is confirm-and-close)
    const btnRow = document.createElement("div");
    btnRow.className = "sheet-btn-row";
    const save = document.createElement("button");
    save.className = "sheet-act save-act";
    save.innerHTML = checkSVG + "<span>Save</span>";
    save.onclick = () => { clearTimeout(nTimer); saveNotes(); closeSheet(); };
    btnRow.appendChild(save);

    const del = document.createElement("button");
    del.className = "sheet-act danger";
    del.innerHTML = trashSVG + "<span>Delete</span>";
    del.onclick = () => { deleteDoc(doc(db, "items", it.id)); closeSheet(); };
    btnRow.appendChild(del);
    acts.appendChild(btnRow);

    sheetOpenedAt = Date.now();
    $("sheet").classList.remove("hidden");
  }

  function taskRow(it, sortable) {
    const el = rowShell(it);
    const body = el.querySelector(".body");
    body.innerHTML = `<div class="text taskline"><span class="ttext"></span></div><div class="meta"></div>`;
    body.querySelector(".ttext").textContent = it.text;
    const meta = body.querySelector(".meta");

    if (it.assignee) {
      const av = avatarEl(it.assigneeUid || "", it.assignee, "lg");
      av.classList.add("inline-av");
      body.querySelector(".text").appendChild(av);
    }
    if (it.due) {
      const d = document.createElement("span");
      d.className = "m-due" + (it.due < todayISO() ? " overdue" : "");
      d.textContent = dueLabel(it.due);
      meta.appendChild(d);
    }
    if (!it.done && it.due) {
      if (it.due < todayISO()) el.classList.add("od");
      else if (it.due === todayISO()) el.classList.add("due-soon");
    }
    if (it.repeatDays > 0 || it.repeatType) {
      const rl = repeatLabel(it);
      if (rl) { const r = document.createElement("span"); r.className = "m-rep"; r.textContent = rl; meta.appendChild(r); }
    }
    if (it.notes) {
      const n = document.createElement("span");
      n.className = "m-note";
      n.textContent = "📝 " + it.notes.split("\n")[0].slice(0, 40) + (it.notes.length > 40 ? "…" : "");
      meta.appendChild(n);
    }
    if (!meta.children.length) meta.remove();

    if (sortable && !it.done) addHandle(el, it);

    // Repeating tasks reschedule on check-off instead of staying done
    if (isRepeating(it) && !it.done) {
      el.querySelector(".check").onclick = () => {
        const t = it.repeatType || "interval";
        const base = (t === "interval") ? todayISO() : addDays(todayISO(), 1);
        const next = nextDue(it, base);
        updateDoc(doc(db, "items", it.id), { due: next });
      };
    }

    attachLongPress(el, () => openTaskSheet(it));
    return el;
  }

  function groceryRow(it, sortable) {
    const el = rowShell(it);
    const body = el.querySelector(".body");
    const qty = it.qty || 1;
    body.innerHTML = `<div class="text"><span class="tname"></span><span class="tqty"></span></div>`;
    body.querySelector(".tname").textContent = it.text;
    if (qty > 1) body.querySelector(".tqty").textContent = ` (${qty})`;

    if (!it.done) {
      // Tap: right half = more, left half = less (min 1). Long-press = options.
      body.classList.add("qty-tap");
      body.onclick = (e) => {
        const rect = body.getBoundingClientRect();
        const inc = (e.clientX - rect.left) > rect.width / 2 ? 1 : -1;
        updateDoc(doc(db, "items", it.id), { qty: Math.max(1, qty + inc) });
      };
      const store = it.store || "";
      const chip = document.createElement("button");
      chip.className = "store-chip" + (store ? "" : " empty");
      chip.textContent = store || "+ store";
      if (store) { chip.style.background = STORE_COLOR[store]; chip.style.color = "#fff"; chip.style.borderColor = "transparent"; }
      chip.onclick = () => updateDoc(doc(db, "items", it.id), { store: nextStore(store) });
      // Long-press opens the full store picker (works even with no store set)
      ["touchstart", "mousedown"].forEach((ev) => chip.addEventListener(ev, (e) => e.stopPropagation()));
      attachLongPress(chip, () => openStorePicker(it));
      el.querySelector(".row-actions").appendChild(chip);
      if (sortable) addHandle(el, it);
    }

    attachLongPress(el, () => openSheet(it));
    if (it.photo) {
      const t = document.createElement("span");
      t.className = "gthumb";
      t.style.backgroundImage = `url("${it.photo}")`;
      el.insertBefore(t, body);
    }
    return el;
  }

  function suggestionChip(it) {
    const c = document.createElement("button");
    c.className = "schip";
    c.innerHTML = `<span class="sdot"></span><span class="stext"></span><span class="sx" aria-label="Remove">×</span>`;
    c.querySelector(".stext").textContent = it.text;
    c.querySelector(".sdot").style.background = it.store ? STORE_COLOR[it.store] : "var(--line)";
    c.onclick = () => updateDoc(doc(db, "items", it.id), { archived: false, done: false, store: it.store || DEFAULT_STORE, createdAt: serverTimestamp() });
    c.querySelector(".sx").onclick = (e) => { e.stopPropagation(); deleteDoc(doc(db, "items", it.id)); };
    return c;
  }

  async function saveBought() {
    const batch = writeBatch(db);
    allItems.filter((i) => i.list === "groceries" && i.done && !i.archived)
            .forEach((i) => batch.update(doc(db, "items", i.id), { archived: true, done: false }));
    await batch.commit();
  }

  async function deleteMany(items) {
    const batch = writeBatch(db);
    items.forEach((i) => batch.delete(doc(db, "items", i.id)));
    await batch.commit();
  }

  function addHandle(el, it) {
    el.dataset.sort = "1"; el.dataset.id = it.id;
    const h = document.createElement("span");
    h.className = "drag-handle"; h.innerHTML = gripSVG;
    ["touchstart", "mousedown"].forEach((ev) => h.addEventListener(ev, (e) => e.stopPropagation()));
    el.querySelector(".row-actions").appendChild(h);
  }
  function getRowAfter(wrap, y) {
    const els = [...wrap.querySelectorAll('[data-sort]:not(.dragging)')];
    let best = { offset: -Infinity, el: null };
    for (const child of els) {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > best.offset) best = { offset, el: child };
    }
    return best.el;
  }
  function commitOrder(wrap) {
    const ids = [...wrap.querySelectorAll('[data-sort]')].map((el) => el.dataset.id);
    const batch = writeBatch(db);
    ids.forEach((id, i) => batch.update(doc(db, "items", id), { order: i }));
    batch.commit();
  }
  function makeSortable(wrap) {
    wrap.querySelectorAll('[data-sort]').forEach((row) => {
      const handle = row.querySelector(".drag-handle");
      if (!handle) return;
      handle.addEventListener("pointerdown", (e) => {
        if (e.button && e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        row.classList.add("dragging");
        const move = (ev) => {
          ev.preventDefault();
          const after = getRowAfter(wrap, ev.clientY);
          if (after == null) {
            if (wrap.lastElementChild !== row) wrap.appendChild(row);
          } else if (after !== row && row.nextElementSibling !== after) {
            wrap.insertBefore(row, after);
          }
        };
        const end = () => {
          row.classList.remove("dragging");
          document.removeEventListener("pointermove", move);
          document.removeEventListener("pointerup", end);
          document.removeEventListener("pointercancel", end);
          commitOrder(wrap);
        };
        document.addEventListener("pointermove", move, { passive: false });
        document.addEventListener("pointerup", end);
        document.addEventListener("pointercancel", end);
      });
    });
  }

  /* ---------- Add ---------- */
  async function addItem() {
    const input = $("addInput");
    const text = input.value.trim();
    if (!text || !me) return;
    input.value = "";
    input.focus(); // keep keyboard up for rapid entry
    const ta = $("typeahead"); ta.classList.add("hidden"); ta.innerHTML = "";
    if (currentList === "recipes") {
      if (openRecipeId) {
        const r = allItems.find((i) => i.id === openRecipeId);
        const next = [...((r && r.ingredients) || []), text];
        await updateDoc(doc(db, "items", openRecipeId), { ingredients: next });
      } else {
        await addDoc(itemsCol, { text, list: "recipes", ingredients: [], addedBy: firstName(me), uid: me.uid, createdAt: serverTimestamp() });
      }
      return;
    }
    if (currentList === "groceries") {
      const match = allItems.find((i) => i.list === "groceries" && (i.text || "").trim().toLowerCase() === text.toLowerCase());
      if (match) {
        if (match.done || match.archived) {
          // Revive from crossed-off / Buy again instead of duplicating
          await updateDoc(doc(db, "items", match.id), { done: false, archived: false, qty: 1, store: match.store || DEFAULT_STORE, createdAt: serverTimestamp() });
          if (!match.store) openStorePicker({ id: match.id, store: "" });
        }
        // Already on the active list: nothing to create
        return;
      }
      const ref = await addDoc(itemsCol, {
        text, list: "groceries", done: false, archived: false, store: DEFAULT_STORE, qty: 1,
        addedBy: firstName(me), uid: me.uid, createdAt: serverTimestamp()
      });
      openStorePicker({ id: ref.id, store: DEFAULT_STORE });
      return;
    }
    await addDoc(itemsCol, {
      text, list: currentList, done: false, archived: false, store: "", qty: 1,
      addedBy: firstName(me), uid: me.uid, createdAt: serverTimestamp()
    });
  }

  function updateAddPlaceholder() {
    const i = $("addInput");
    if (currentList === "tasks") i.placeholder = "Add a task…";
    else if (currentList === "recipes") i.placeholder = openRecipeId ? "Add an ingredient…" : "Add a recipe…";
    else i.placeholder = "Add an item…";
  }
  $("addBtn").onclick = addItem;
  $("addInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addItem(); } });

  /* ---------- Grocery typeahead ---------- */
  function statusOf(it) { return it.archived ? "buy again" : it.done ? "crossed off" : "on list"; }
  function renderTypeahead() {
    const box = $("typeahead");
    const q = $("addInput").value.trim().toLowerCase();
    if (currentList !== "groceries" || q.length < 1) { box.classList.add("hidden"); box.innerHTML = ""; return; }
    const seen = new Set();
    const pool = allItems.filter((i) => i.list === "groceries" && (i.text || "").trim())
      .filter((i) => { const k = i.text.trim().toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
    const starts = [], contains = [];
    for (const i of pool) {
      const t = i.text.trim().toLowerCase();
      if (t === q) continue;
      if (t.startsWith(q)) starts.push(i);
      else if (t.includes(q)) contains.push(i);
    }
    const matches = [...starts, ...contains].slice(0, 6);
    if (!matches.length) { box.classList.add("hidden"); box.innerHTML = ""; return; }
    box.innerHTML = "";
    for (const it of matches) {
      const b = document.createElement("button");
      b.className = "ta-chip";
      b.type = "button";
      const dot = it.store ? `<span class="ta-dot" style="background:${STORE_COLOR[it.store] || "var(--muted)"}"></span>` : "";
      b.innerHTML = `${dot}<span class="ta-name"></span><span class="ta-status"></span>`;
      b.querySelector(".ta-name").textContent = it.text;
      b.querySelector(".ta-status").textContent = statusOf(it);
      // mousedown so it fires before the input blurs on iOS
      b.addEventListener("mousedown", (e) => e.preventDefault());
      b.onclick = () => { $("addInput").value = it.text; addItem(); };
      box.appendChild(b);
    }
    box.classList.remove("hidden");
  }
  $("addInput").addEventListener("input", renderTypeahead);
  $("addInput").addEventListener("blur", () => setTimeout(() => { $("typeahead").classList.add("hidden"); }, 150));
  $("addInput").addEventListener("focus", renderTypeahead);

  /* ---------- Tabs ---------- */
  function switchTab(name) {
    currentList = name;
    storeFilter = null;
    openRecipeId = null;
    selectedIng = new Set();
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x.dataset.list === name));
    render();
    $("addInput").focus();
  }
  document.querySelectorAll(".tab").forEach((t) => { t.onclick = () => switchTab(t.dataset.list); });
</script>
