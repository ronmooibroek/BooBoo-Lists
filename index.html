<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f7f1e8" />
<title>Our Lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  :root {
    --bg: #f7f1e8;
    --surface: #fffdf9;
    --ink: #2e2a25;
    --muted: #948a7e;
    --accent: #c75d3c;
    --accent-dark: #a8472b;
    --done: #8a9a73;
    --line: #ebe2d4;
    --shadow: 0 1px 2px rgba(46,42,37,.05), 0 8px 24px rgba(46,42,37,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "DM Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    background-image: radial-gradient(circle at 12% 8%, rgba(199,93,60,.06), transparent 40%),
                      radial-gradient(circle at 90% 100%, rgba(138,154,115,.07), transparent 45%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 600px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- Sign-in screen ---------- */
  .signin {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 28px; gap: 8px;
  }
  .signin h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: 44px; margin: 0; letter-spacing: -.5px; }
  .signin p { color: var(--muted); margin: 0 0 24px; font-size: 16px; max-width: 280px; }
  .mark {
    width: 78px; height: 78px; border-radius: 22px; margin-bottom: 14px;
    background: var(--accent); color: #fff; display: grid; place-items: center;
    font-family: "Fraunces", serif; font-size: 38px; box-shadow: var(--shadow);
    transform: rotate(-4deg);
  }
  .gbtn {
    display: inline-flex; align-items: center; gap: 12px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    padding: 13px 22px; border-radius: 999px; font-size: 16px; font-weight: 500;
    font-family: inherit; box-shadow: var(--shadow); transition: transform .12s ease;
  }
  .gbtn:active { transform: scale(.97); }
  .gbtn svg { width: 19px; height: 19px; }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 22px 14px; padding-top: max(20px, env(safe-area-inset-top));
  }
  .brand { font-family: "Fraunces", serif; font-weight: 600; font-size: 27px; letter-spacing: -.4px; }
  .who { display: flex; align-items: center; gap: 9px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-weight: 600; font-size: 14px; flex-shrink: 0;
    background-size: cover; background-position: center; cursor: pointer;
  }
  .signout {
    background: none; border: none; color: var(--muted); font-family: inherit;
    font-size: 13px; cursor: pointer; padding: 6px; text-decoration: underline; text-underline-offset: 2px;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; gap: 6px; margin: 4px 18px 8px; padding: 5px;
    background: rgba(46,42,37,.04); border-radius: 14px;
  }
  .tab {
    flex: 1; min-width: 0; border: none; background: none; font-family: inherit; cursor: pointer;
    padding: 9px 5px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--muted);
    display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; transition: all .18s ease;
  }
  .tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .count {
    font-size: 11px; font-weight: 600; min-width: 17px; height: 18px; padding: 0 5px;
    border-radius: 999px; display: inline-grid; place-items: center;
    background: rgba(46,42,37,.07); color: var(--muted);
  }
  .tab.active .count { background: var(--accent); color: #fff; }

  /* ---------- List ---------- */
  main { flex: 1; padding: 6px 14px 130px; }
  .item {
    display: flex; align-items: center; gap: 13px; padding: 11px 14px; margin: 7px 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); animation: pop .22s ease both;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
  .check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line);
    flex-shrink: 0; margin-top: 1px; cursor: pointer; background: none; padding: 0;
    display: grid; place-items: center; transition: all .15s ease;
  }
  .check svg { width: 13px; height: 13px; opacity: 0; transform: scale(.5); transition: all .15s ease; color: #fff; }
  .item.done .check { background: var(--done); border-color: var(--done); }
  .item.done .check svg { opacity: 1; transform: scale(1); }
  .body { flex: 1; min-width: 0; }
  .body.qty-tap { cursor: pointer; user-select: none; -webkit-user-select: none; }
  .tqty { color: var(--muted); font-weight: 600; }
  .text { font-size: 16px; line-height: 1.35; word-break: break-word; }
  .item.done .text { text-decoration: line-through; color: var(--muted); }
  .meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .del {
    background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px;
    border-radius: 8px; flex-shrink: 0; line-height: 0; opacity: .55; transition: opacity .15s, color .15s;
  }
  .del:active { color: var(--accent); opacity: 1; }
  .del svg { width: 17px; height: 17px; }

  .row-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; align-self: center; }
  .store-chip {
    font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 6px 11px; border-radius: 999px; transition: transform .12s;
  }
  .store-chip.empty { color: var(--muted); font-weight: 500; }
  .store-chip:active { transform: scale(.93); }
  .act { background: none; border: none; cursor: pointer; color: var(--done); padding: 5px; border-radius: 8px; line-height: 0; opacity: .85; }
  .act svg { width: 19px; height: 19px; }
  .act.save:active { color: var(--accent); transform: scale(.9); }

  .suggest { margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .suggest-h { font-family: "Fraunces", serif; font-size: 18px; font-weight: 600; margin: 0 2px 11px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .schip {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 7px 7px 13px; font-family: inherit; font-size: 14px; color: var(--ink);
    box-shadow: var(--shadow); transition: transform .12s;
  }
  .schip:active { transform: scale(.95); }
  .sdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .sx { color: var(--muted); font-size: 18px; line-height: 1; padding: 0 4px; }
  .sx:active { color: var(--accent); }

  /* ---------- Long-press action sheet ---------- */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 60; background: rgba(46,42,37,.38);
    display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } }
  .sheet {
    width: 100%; max-width: 600px; background: var(--surface);
    border-radius: 22px 22px 0 0; padding: 8px 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    box-shadow: 0 -8px 40px rgba(46,42,37,.22);
    animation: sheetUp .25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  .sheet-title {
    text-align: center; font-weight: 600; color: var(--muted); font-size: 14px;
    padding: 12px 8px 8px; word-break: break-word;
  }
  .sheet-act {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--bg); border: none; border-radius: 14px; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 500; color: var(--ink);
    padding: 15px 18px; margin: 7px 0; text-align: left;
  }
  .sheet-act:active { filter: brightness(.96); }
  .sheet-act svg { width: 21px; height: 21px; flex-shrink: 0; }
  .sheet-act.keep svg { color: var(--done); }
  .sheet-act.danger, .sheet-act.danger svg { color: #c0392b; }
  .sheet-cancel {
    width: 100%; background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 600; color: var(--muted);
    padding: 15px; margin-top: 2px;
  }

  /* ---------- Store filter bar ---------- */
  .filter-bar { display: flex; align-items: center; gap: 10px; padding: 4px 2px 10px; }
  .filter-pill { color: #fff; font-size: 13px; font-weight: 600; padding: 6px 13px; border-radius: 999px; }
  .filter-clear {
    margin-left: auto; background: none; border: none; cursor: pointer; color: var(--muted);
    font-family: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; padding: 6px;
  }

  /* ---------- Task sheet controls ---------- */
  .sheet-section { background: var(--bg); border-radius: 14px; padding: 12px 14px; margin: 7px 0; }
  .sheet-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
  .people { display: flex; flex-wrap: wrap; gap: 8px; }
  .person {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-family: inherit;
    font-size: 14px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 7px 13px;
  }
  .person.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .pdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .due-row { display: flex; align-items: center; gap: 10px; }
  .due-input {
    flex: 1; font-family: inherit; font-size: 15px; padding: 9px 11px;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
  }
  .due-clear { background: none; border: none; color: var(--muted); font-family: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .repeat-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; color: var(--ink); }
  .rep-input {
    width: 56px; font-family: inherit; font-size: 15px; padding: 8px; text-align: center;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
  }
  .rep-modes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 11px; }
  .rep-mode {
    font-family: inherit; font-size: 13px; cursor: pointer; background: var(--surface);
    border: 1.5px solid var(--line); color: var(--ink); border-radius: 999px; padding: 7px 12px;
  }
  .rep-mode.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .rep-off { color: var(--muted); font-size: 14px; }
  .weekday-row { display: flex; gap: 6px; }
  .wd {
    flex: 1; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--surface); border: 1.5px solid var(--line); color: var(--ink);
    border-radius: 10px; padding: 9px 0;
  }
  .wd.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .m-assignee { display: inline-flex; align-items: center; gap: 5px; }
  .m-due { color: var(--muted); }
  .m-due.overdue { color: #c0392b; font-weight: 600; }
  .m-rep { color: var(--muted); }

  .avt {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
    background-size: cover; background-position: center; overflow: hidden;
    display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700;
  }
  .avt.big { width: 46px; height: 46px; font-size: 18px; }
  .avt.lg { width: 32px; height: 32px; font-size: 14px; }
  .gthumb { width: 40px; height: 40px; border-radius: 9px; background-size: cover; background-position: center; flex-shrink: 0; }
  .sheet-photo { display: block; width: 100%; max-width: 300px; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px; margin: 6px auto 12px; }

  /* ---------- Recipes ---------- */
  .recipe-row { cursor: pointer; }
  .recipe-row .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .chev { color: var(--muted); font-size: 22px; margin-left: 8px; flex-shrink: 0; }
  .recipe-head { display: flex; align-items: center; gap: 12px; padding: 4px 2px 14px; flex-wrap: wrap; }
  .back-btn { background: none; border: none; color: var(--accent); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; padding: 4px 0; }
  .recipe-title { font-family: "Fraunces", serif; font-size: 22px; font-weight: 600; width: 100%; }
  .ing-check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: none;
    flex-shrink: 0; cursor: pointer; padding: 0; position: relative;
  }
  .ing-row.sel .ing-check { background: var(--accent); border-color: var(--accent); }
  .ing-row.sel .ing-check::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 700; position: absolute; inset: 0; display: grid; place-items: center; }
  .ing-row.sel .text { font-weight: 600; }
  .recipe-add-btn {
    display: block; width: 100%; margin: 18px 0 8px; padding: 15px; border: none; border-radius: 14px;
    background: var(--accent); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .recipe-add-btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .recipe-add-btn:not(:disabled):active { background: var(--accent-dark); }

  /* Recipe detail / cookbook */
  .recipe-actions { display: flex; gap: 10px; margin: 0 0 14px; }
  .recipe-serves { color: var(--muted); font-size: 14px; margin: -4px 2px 14px; }
  .rc-section-h { font-family: "Fraunces", serif; font-size: 19px; font-weight: 600; margin: 18px 2px 8px; }
  .step-row { display: flex; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); }
  .step-num { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .step-text { line-height: 1.45; }
  .rc-btn { flex: 1; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .rc-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rc-btn.primary:active { background: var(--accent-dark); }

  /* Import overlay */
  .overlay { position: fixed; inset: 0; z-index: 60; background: rgba(46,42,37,.4); display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .2s ease; }
  .overlay-card { width: 100%; max-width: 600px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 18px; padding-bottom: max(16px, env(safe-area-inset-bottom)); box-shadow: 0 -8px 40px rgba(46,42,37,.22); animation: sheetUp .25s cubic-bezier(.2,.8,.2,1); max-height: 92vh; overflow-y: auto; }
  .overlay-title { font-family: "Fraunces", serif; font-size: 22px; font-weight: 600; }
  .overlay-sub { color: var(--muted); font-size: 14px; margin: 6px 0 12px; line-height: 1.4; }
  .import-text { width: 100%; min-height: 170px; resize: vertical; font-family: inherit; font-size: 15px; line-height: 1.4; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
  .import-status { font-size: 13px; color: var(--muted); min-height: 18px; margin-top: 8px; }
  .overlay-btns { display: flex; gap: 10px; margin-top: 12px; }
  .overlay-cancel { width: 100%; background: none; border: none; color: var(--muted); font-family: inherit; font-size: 15px; font-weight: 600; padding: 14px; cursor: pointer; margin-top: 4px; }

  /* Cooking mode */
  .cook { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 24px; text-align: center; }
  .cook-close { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; }
  .cook-title { font-family: "Fraunces", serif; font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .cook-counter { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 26px; }
  .cook-step { font-size: 26px; line-height: 1.4; max-width: 520px; }
  .cook-nav { display: flex; gap: 12px; margin-top: 36px; width: 100%; max-width: 420px; }
  .cook-btn { flex: 1; padding: 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-family: inherit; font-size: 16px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .cook-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cook-btn:disabled { opacity: .4; cursor: default; }
  .taskline { display: flex; align-items: center; gap: 10px; }
  .taskline .ttext { flex: 1; min-width: 0; word-break: break-word; }
  .inline-av { margin-left: auto; }
  .profile-row { display: flex; align-items: center; gap: 13px; }
  .profile-name { flex: 1; font-size: 16px; font-weight: 500; }
  .profile-btn {
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px;
    padding: 8px 15px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer;
  }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty .em-mark { font-size: 40px; margin-bottom: 8px; }
  .clear-done {
    display: block; margin: 16px auto 0; background: none; border: none; cursor: pointer;
    color: var(--muted); font-family: inherit; font-size: 13px; padding: 8px 14px;
    border-radius: 999px; text-decoration: underline; text-underline-offset: 2px;
  }
  .upcoming { margin-top: 20px; }
  .upcoming-head {
    display: flex; align-items: center; gap: 9px; width: 100%; cursor: pointer;
    background: none; border: none; border-top: 1px dashed var(--line);
    padding: 16px 2px 12px; font-family: inherit;
  }
  .up-title { font-family: "Fraunces", serif; font-size: 18px; font-weight: 600; color: var(--ink); }
  .up-count { font-size: 12px; font-weight: 600; background: rgba(46,42,37,.07); color: var(--muted); border-radius: 999px; padding: 2px 8px; }
  .up-chev { margin-left: auto; color: var(--muted); font-size: 13px; }

  /* ---------- Add bar ---------- */
  .addbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 12px 14px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, rgba(247,241,232,0));
  }
  .addinner {
    max-width: 600px; margin: 0 auto; display: flex; gap: 9px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 7px 7px 7px 16px; box-shadow: 0 4px 24px rgba(46,42,37,.1);
  }
  .addinner input {
    flex: 1; border: none; outline: none; background: none; font-family: inherit;
    font-size: 16px; color: var(--ink); padding: 8px 0;
  }
  .addinner input::placeholder { color: var(--muted); }
  .add {
    width: 40px; height: 40px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; flex-shrink: 0; display: grid; place-items: center;
    transition: transform .12s, background .12s;
  }
  .add:active { transform: scale(.92); background: var(--accent-dark); }
  .add svg { width: 20px; height: 20px; }

  .hidden { display: none !important; }
  #loading { flex: 1; display: grid; place-items: center; color: var(--muted); }

  /* ---------- Intro / love screen ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 50; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center;
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 40%, rgba(214,69,47,.12), transparent 62%);
    animation: introIn .4s ease;
  }
  .intro.fade-out { animation: introOut .55s ease forwards; }
  @keyframes introIn { from { opacity: 0; } }
  @keyframes introOut { to { opacity: 0; visibility: hidden; } }
  .heart {
    width: 148px; height: auto; color: #d6452f;
    filter: drop-shadow(0 12px 26px rgba(214,69,47,.35));
    animation: beat 1.15s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.17); }
    28% { transform: scale(1.02); }
    42% { transform: scale(1.11); }
    56% { transform: scale(1); }
  }
  .intro-greet { font-family: "Fraunces", serif; font-size: 32px; font-weight: 600; }
  .intro-sub { color: var(--muted); font-size: 14px; letter-spacing: .4px; }
  .photo-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
  .heart-stage { position: relative; display: grid; place-items: center; width: 300px; max-width: 86vw; height: 200px; }
  .intro-avs { position: absolute; inset: 0; pointer-events: none; }
  .intro-av {
    position: absolute; top: 50%; width: 66px; height: 66px; border-radius: 50%;
    background-size: cover; background-position: center; border: 3px solid var(--bg);
    box-shadow: 0 6px 18px rgba(46,42,37,.2); display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 24px; overflow: hidden;
  }
  .intro-av.left { left: 4px; transform: translateY(-50%) rotate(-6deg); animation: floatL 3.2s ease-in-out infinite; }
  .intro-av.right { right: 4px; transform: translateY(-50%) rotate(6deg); animation: floatR 3.2s ease-in-out infinite; }
  @keyframes floatL { 0%, 100% { transform: translateY(-50%) rotate(-6deg); } 50% { transform: translateY(-64%) rotate(-6deg); } }
  @keyframes floatR { 0%, 100% { transform: translateY(-50%) rotate(6deg); } 50% { transform: translateY(-36%) rotate(6deg); } }
</style>
</head>
<body>
<div class="app">

  <div id="loading">Loading…</div>

  <!-- Intro / love screen — drop photos into .photo-strip later -->

      </svg>

      <button class="tab" data-list="tasks">✓ Tasks <span class="count" id="count-tasks">0</span></button>

        <button class="add" id="addBtn" aria-label="Add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Long-press action sheet -->
  <input type="file" id="photoInput" accept="image/*" style="display:none" />
  <div id="sheet" class="sheet-backdrop hidden">
    <div class="sheet">
      <div class="sheet-title" id="sheetTitle"></div>
      <div id="sheetActions"></div>
      <button class="sheet-cancel" id="sheetCancel">Cancel</button>
    </div>
  </div>

  <!-- Import recipe overlay -->
  <input type="file" id="ocrInput" accept="image/*" style="display:none" />
  <div id="import" class="overlay hidden">
    <div class="overlay-card">
      <div class="overlay-title">Add a recipe</div>
      <p class="overlay-sub">Paste a recipe, or scan a photo. The app pulls out the ingredients and steps — you can tidy them after saving.</p>
      <textarea id="importText" class="import-text" placeholder="Paste the full recipe here…"></textarea>
      <div id="importStatus" class="import-status"></div>
      <div class="overlay-btns">
        <button id="scanBtn" class="rc-btn">Scan a photo</button>
        <button id="parseBtn" class="rc-btn primary">Parse &amp; save</button>
      </div>
      <button id="importCancel" class="overlay-cancel">Cancel</button>
    </div>
  </div>

  <!-- Cooking mode -->
  <div id="cook" class="cook hidden">
    <button id="cookClose" class="cook-close" aria-label="Exit">✕</button>
    <div class="cook-title" id="cookTitle"></div>

      <button id="cookNext" class="cook-btn primary">Next</button>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithCredential, signOut, onAuthStateChanged,
           setPersistence, browserLocalPersistence }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot,
           query, orderBy, serverTimestamp, writeBatch }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  /* ============================================================
     STEP 1 — PASTE YOUR FIREBASE CONFIG HERE
     Firebase console → Project settings → "Your apps" → Web app → Config
     ============================================================ */
  const firebaseConfig = {
    apiKey: "AIzaSyBFflo342VzLk4JSsJf__e1yK-OVA78fkc",
    authDomain: "booboo-list.firebaseapp.com",
    projectId: "booboo-list",
    storageBucket: "booboo-list.firebasestorage.app",
    messagingSenderId: "59995644087",
    appId: "1:59995644087:web:2d3e5d78105238cd826d32"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const itemsCol = collection(db, "items");

  /* ============================================================
     STEP 2 — PASTE YOUR GOOGLE WEB CLIENT ID HERE
     Firebase console → Authentication → Sign-in method → Google →
     "Web SDK configuration" → Web client ID (ends in .apps.googleusercontent.com)
     ============================================================ */
  const GOOGLE_CLIENT_ID = "59995644087-qv6sjlmgi9jvgi5qnpffraj8nrgem67d.apps.googleusercontent.com";

  let currentList = "groceries";
  let storeFilter = null;
  let upcomingOpen = true;
  let openRecipeId = null;
  let selectedIng = new Set();
  let importTarget = null;
  let cookSteps = [];
  let cookIdx = 0;
  let wakeLock = null;
  let allItems = [];
  let profiles = {};
  let pendingPhoto = null;
  let unsub = null;
  let me = null;

  const $ = (id) => document.getElementById(id);

  // Stable warm color per person (so each of you is recognizable)
  function colorFor(uid) {
    const palette = ["#c75d3c", "#5b8c8a", "#8a9a73", "#b08544", "#9a6a8c", "#6a7fa8"];
    let h = 0; for (const c of (uid || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return palette[h % palette.length];
  }
  const firstName = (u) => (u.displayName || u.email || "?").split(/[ @]/)[0];

  const STORES = ["Costco", "Food Basics", "Farm Boy"];
  const STORE_COLOR = { "Costco": "#2f6db0", "Food Basics": "#c75d3c", "Farm Boy": "#4f8f4a" };
  const nextStore = (s) => {
    const i = STORES.indexOf(s);
    return i === -1 ? STORES[0] : (i === STORES.length - 1 ? "" : STORES[i + 1]);
  };
  const checkSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>`;
  const trashSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>`;
  const saveSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
  const filterSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>`;
  const cameraSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3l2-2h8l2 2h3v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>`;

  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function dueLabel(iso) {
    const t = todayISO();
    if (iso === t) return "Due today";
    if (iso === addDays(t, 1)) return "Due tomorrow";
    const d = new Date(iso + "T00:00:00");
    return "Due " + MON[d.getMonth()] + " " + d.getDate();
  }
  function knownPeople() {
    const map = new Map();
    if (me) map.set(me.uid, firstName(me));
    for (const it of allItems) {
      if (!it.uid) continue;
      if (it.kind === "profile") { if (!map.has(it.uid) && it.name) map.set(it.uid, it.name); continue; }
      if (it.addedBy) map.set(it.uid, it.addedBy);
    }
    return [...map.entries()].map(([uid, name]) => ({ uid, name }));
  }

  function photoFor(uid) { return uid ? (profiles[uid] || "") : ""; }
  function rebuildProfiles() {
    profiles = {};
    for (const it of allItems) if (it.kind === "profile" && it.uid && it.photo) profiles[it.uid] = it.photo;
  }
  function avatarEl(uid, name, cls) {
    const el = document.createElement("span");
    el.className = "avt" + (cls ? " " + cls : "");
    const ph = photoFor(uid);
    if (ph) { el.style.backgroundImage = `url("${ph}")`; }
    else { el.classList.add("init"); el.style.background = uid ? colorFor(uid) : "var(--line)"; el.textContent = (name || "?")[0].toUpperCase(); }
    return el;
  }
  function fileToAvatar(file, size, cb) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = size; c.height = size;
        const ctx = c.getContext("2d");
        const scale = Math.max(size / img.width, size / img.height); // cover crop
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        cb(c.toDataURL("image/jpeg", 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  async function setProfilePhoto(person, dataUrl) {
    const existing = allItems.find((i) => i.kind === "profile" && i.uid === person.uid);
    if (existing) await updateDoc(doc(db, "items", existing.id), { photo: dataUrl, name: person.name });
    else await addDoc(itemsCol, { kind: "profile", uid: person.uid, name: person.name, photo: dataUrl, createdAt: serverTimestamp() });
  }
  function updateHeaderAvatar() {
    if (!me) return;
    const av = $("avatar");
    const ph = photoFor(me.uid);
    if (ph) { av.style.backgroundImage = `url("${ph}")`; av.textContent = ""; av.style.backgroundColor = "transparent"; }
    else { av.style.backgroundImage = "none"; av.textContent = firstName(me)[0].toUpperCase(); av.style.background = colorFor(me.uid); }
  }

  const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  function nextWeekday(weekday, fromISO) {
    const d = new Date(fromISO + "T00:00:00");
    while (d.getDay() !== weekday) d.setDate(d.getDate() + 1);
    return isoOf(d);
  }
  function nextDom(dom, fromISO) {
    const d = new Date(fromISO + "T00:00:00");
    for (let i = 0; i < 370; i++) {
      const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); // days in this month
      if (d.getDate() === Math.min(dom, dim)) return isoOf(d);
      d.setDate(d.getDate() + 1);
    }
    return isoOf(d);
  }
  const WD_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function ordinal(n) { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); }
  function isRepeating(it) {
    const t = it.repeatType || (it.repeatDays > 0 ? "interval" : "");
    if (t === "interval") return it.repeatDays > 0;
    if (t === "weekly") return Number.isInteger(it.repeatWeekday);
    if (t === "monthly") return it.repeatDom >= 1;
    return false;
  }
  function nextDue(it, fromISO) {
    const t = it.repeatType || (it.repeatDays > 0 ? "interval" : "");
    if (t === "interval") return addDays(fromISO, it.repeatDays || 1);
    if (t === "weekly") return nextWeekday(it.repeatWeekday || 0, fromISO);
    if (t === "monthly") return nextDom(it.repeatDom || 1, fromISO);
    return "";
  }
  function repeatLabel(it) {
    const t = it.repeatType || (it.repeatDays > 0 ? "interval" : "");
    if (t === "interval" && it.repeatDays > 0) return "↻ " + it.repeatDays + "d";
    if (t === "weekly" && Number.isInteger(it.repeatWeekday)) return "↻ " + WD_SHORT[it.repeatWeekday];
    if (t === "monthly" && it.repeatDom >= 1) return "↻ " + ordinal(it.repeatDom);
    return "";
  }

  /* ---------- Auth (Google Identity Services — works on iPhone) ---------- */
  async function handleCredential(response) {
    try {
      await setPersistence(auth, browserLocalPersistence);
      const cred = GoogleAuthProvider.credential(response.credential);
      await signInWithCredential(auth, cred);
    } catch (e) {
      alert("Sign-in failed: " + (e.message || e.code));
    }
  }

  function initGoogle() {
    if (!(window.google && google.accounts && google.accounts.id)) {
      return setTimeout(initGoogle, 200); // wait for the GIS script to load
    }
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredential });
    google.accounts.id.renderButton(
      document.getElementById("gbtnContainer"),
      { theme: "outline", size: "large", shape: "pill", text: "continue_with" }
    );
  }
  initGoogle();

  $("signoutBtn").onclick = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    $("loading").classList.add("hidden");
    if (user) {
      me = user;
      $("signin").classList.add("hidden");
      $("main").classList.remove("hidden");
      $("avatar").onclick = openProfilesSheet;
      updateHeaderAvatar();
      startSync();
      showIntro();
    } else {
      me = null;
      if (unsub) { unsub(); unsub = null; }
      $("main").classList.add("hidden");
      $("intro").classList.add("hidden");
      $("signin").classList.remove("hidden");
    }
  });

  function showIntro() {
    const intro = $("intro");
    $("introGreet").textContent = "Hi " + firstName(me);
    renderIntroAvatars();
    intro.classList.remove("hidden", "fade-out");
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      intro.classList.add("fade-out");
      setTimeout(() => intro.classList.add("hidden"), 600);
    };
    const timer = setTimeout(finish, 2200);   // auto-advances after ~2.2s
    intro.onclick = () => { clearTimeout(timer); finish(); }; // or tap to skip
  }

  function renderIntroAvatars() {
    const stage = $("introAvs");
    if (!stage) return;
    stage.innerHTML = "";
    knownPeople().slice(0, 2).forEach((p, i) => {
      const av = document.createElement("span");
      av.className = "intro-av " + (i === 0 ? "left" : "right");
      const ph = photoFor(p.uid);
      if (ph) av.style.backgroundImage = `url("${ph}")`;
      else { av.style.background = p.uid ? colorFor(p.uid) : "var(--line)"; av.textContent = (p.name || "?")[0].toUpperCase(); }
      stage.appendChild(av);
    });
  }

  /* ---------- Live data ---------- */
  function startSync() {
    if (unsub) unsub();
    const q = query(itemsCol, orderBy("createdAt", "asc"));
    unsub = onSnapshot(q, (snap) => {
      allItems = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      rebuildProfiles();
      updateHeaderAvatar();
      if (!$("intro").classList.contains("hidden")) renderIntroAvatars();
      render();
    }, (err) => {
      console.error(err);
      $("list").innerHTML = '<div class="empty">Could not load. Check your Firestore security rules.</div>';
    });
  }

  /* ---------- Render ---------- */
  function render() {
    const groc = allItems.filter((i) => i.list === "groceries");
    const task = allItems.filter((i) => i.list === "tasks");
    const today = todayISO();
    $("count-groceries").textContent = groc.filter((i) => !i.done && !i.archived).length;
    $("count-tasks").textContent = task.filter((i) => !i.done && (!i.due || i.due <= today)).length;
    $("count-recipes").textContent = allItems.filter((i) => i.list === "recipes").length;

    const list = $("list");
    list.innerHTML = "";
    updateAddPlaceholder();

    if (currentList === "tasks") { renderTasks(task, list); return; }
    if (currentList === "recipes") { renderRecipes(list); return; }

    // ----- Groceries -----
    let live = groc.filter((i) => !i.archived)
      .sort((a, b) => (a.done === b.done ? 0 : a.done ? 1 : -1)); // open first, bought sink
    let suggestions = groc.filter((i) => i.archived)
      .sort((a, b) => (a.text || "").localeCompare(b.text || ""));

    if (storeFilter) {
      list.appendChild(filterBar());
      live = live.filter((i) => (i.store || "") === storeFilter);
      suggestions = suggestions.filter((i) => (i.store || "") === storeFilter);
    }

    if (live.length === 0 && suggestions.length === 0) {
      const e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = storeFilter
        ? `<div class="em-mark">🧺</div>No ${storeFilter} items right now.`
        : `<div class="em-mark">🧺</div>Nothing here yet.<br>Add the first item below.`;
      list.appendChild(e);
      return;
    }

    let anyBought = false;
    for (const it of live) { list.appendChild(groceryRow(it)); anyBought = anyBought || it.done; }

    if (live.length === 0) {
      const note = document.createElement("div");
      note.className = "empty"; note.style.padding = "26px 20px";
      note.innerHTML = `List's all clear 🎉<br><span style="font-size:13px">Tap a “buy again” item below to start the next trip.</span>`;
      list.appendChild(note);
    }

    if (anyBought) {
      const btn = document.createElement("button");
      btn.className = "clear-done";
      btn.textContent = "Save bought items for next time ↓";
      btn.onclick = saveBought;
      list.appendChild(btn);
    }

    if (suggestions.length) {
      const wrap = document.createElement("div");
      wrap.className = "suggest";
      wrap.innerHTML = `<div class="suggest-h">Buy again</div><div class="chips"></div>`;
      const chips = wrap.querySelector(".chips");
      for (const it of suggestions) chips.appendChild(suggestionChip(it));
      list.appendChild(wrap);
    }
  }

  function renderTasks(task, list) {
    const today = todayISO();
    const liveArr = task.filter((i) => i.done || !i.due || i.due <= today)
      .sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        const ad = a.due || "9999-99-99", bd = b.due || "9999-99-99";
        return ad < bd ? -1 : ad > bd ? 1 : 0;
      });
    const futureArr = task.filter((i) => !i.done && i.due && i.due > today)
      .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0));

    if (liveArr.length === 0 && futureArr.length === 0) {
      list.innerHTML = `<div class="empty"><div class="em-mark">🌿</div>Nothing here yet.<br>Add the first item below.</div>`;
      return;
    }

    let anyDone = false;
    for (const it of liveArr) { list.appendChild(taskRow(it)); anyDone = anyDone || it.done; }
    if (liveArr.length === 0) {
      const note = document.createElement("div");
      note.className = "empty"; note.style.padding = "26px 20px";
      note.innerHTML = `Nothing due right now 🌿`;
      list.appendChild(note);
    }
    if (anyDone) {
      const btn = document.createElement("button");
      btn.className = "clear-done";
      btn.textContent = "Clear completed";
      btn.onclick = () => deleteMany(task.filter((i) => i.done));
      list.appendChild(btn);
    }

    if (futureArr.length) {
      const wrap = document.createElement("div");
      wrap.className = "upcoming";
      const head = document.createElement("button");
      head.className = "upcoming-head";
      head.innerHTML = `<span class="up-title">Upcoming</span><span class="up-count"></span><span class="up-chev">${upcomingOpen ? "▾" : "▸"}</span>`;
      head.querySelector(".up-count").textContent = futureArr.length;
      head.onclick = () => { upcomingOpen = !upcomingOpen; render(); };
      wrap.appendChild(head);
      if (upcomingOpen) for (const it of futureArr) wrap.appendChild(taskRow(it));
      list.appendChild(wrap);
    }
  }

  /* ---------- Recipes ---------- */
  function renderRecipes(list) {
    if (openRecipeId) {
      const r = allItems.find((x) => x.id === openRecipeId);
      if (!r) { openRecipeId = null; renderRecipes(list); return; }
      renderRecipeDetail(r, list);
      return;
    }
    const imp = document.createElement("button");
    imp.className = "rc-btn primary";
    imp.style.width = "100%"; imp.style.margin = "2px 0 14px";
    imp.textContent = "⤵ Paste or scan a recipe";
    imp.onclick = () => openImport(null);
    list.appendChild(imp);

    const recipes = allItems.filter((i) => i.list === "recipes").sort((a, b) => (a.text || "").localeCompare(b.text || ""));
    if (recipes.length === 0) {
      const e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = `<div class="em-mark">🍳</div>No recipes yet.<br>Paste one above, or type a name below.`;
      list.appendChild(e);
      return;
    }
    for (const r of recipes) {
      const el = document.createElement("div");
      el.className = "item recipe-row";
      el.innerHTML = `<div class="body"><div class="text"></div><div class="meta"></div></div><span class="chev">›</span>`;

  function parseRecipe(text) {
    const lines = text.replace(/\r/g, "").split("\n").map((l) => l.trim()).filter((l) => l.length);
    let title = lines[0] || "Recipe";
    let servings = "";
    const sv = text.match(/\b(?:serves|serving|yield|yields|makes)\b[:\s]*([0-9]+(?:\s*(?:-|–|to)\s*[0-9]+)?)/i);
    if (sv) servings = sv[1].replace(/\s+/g, " ");
    const isIngHdr = (l) => /^ingredients?\b/i.test(l) && l.length < 28;
    const isStepHdr = (l) => /^(directions?|method|instructions?|steps?|preparation)\b/i.test(l) && l.length < 28;
    let ingStart = -1, stepStart = -1;
    lines.forEach((l, idx) => {
      if (ingStart === -1 && isIngHdr(l)) ingStart = idx;
      else if (ingStart !== -1 && stepStart === -1 && isStepHdr(l)) stepStart = idx;
    });
    let ingredients = [], steps = [];
    if (ingStart !== -1) {
      const before = lines.slice(0, ingStart);
      if (before.length) title = before[0];
      const ingEnd = stepStart > ingStart ? stepStart : lines.length;
      ingredients = lines.slice(ingStart + 1, ingEnd);
      if (stepStart !== -1) steps = lines.slice(stepStart + 1);
    } else {
      const unit = /\b(cups?|tbsp|tablespoons?|tsp|teaspoons?|g|grams?|kg|oz|ounces?|lb|pounds?|ml|l|litres?|liters?|cloves?|pinch|cans?|pkg|packages?|slices?|sticks?)\b/i;
      for (const l of lines.slice(1)) {
        const looksIng = (/^[\d¼½¾⅓⅔⅛⅜⅝⅞]/.test(l) || unit.test(l)) && l.length < 80;
        if (looksIng) ingredients.push(l); else steps.push(l);
      }
    }
    const strip = (s) => s.replace(/^\s*\d+[\.\)]\s*/, "").replace(/^[-•*▢]\s*/, "").trim();
    ingredients = ingredients.map(strip).filter(Boolean);
    steps = steps.map(strip).filter(Boolean);
    if (isIngHdr(title) || isStepHdr(title)) title = "Recipe";
    return { title: title.slice(0, 80), servings, ingredients, steps };
  }

    return data.text || "";
  }

  function attachLongPress(el, handler) {

    const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
    const start = () => { cancel(); timer = setTimeout(() => { timer = null; handler(); }, 500); };
    el.addEventListener("touchstart", start, { passive: true });
    el.addEventListener("touchmove", cancel, { passive: true });
    el.addEventListener("touchend", cancel);
    el.addEventListener("touchcancel", cancel);
    el.addEventListener("mousedown", start);
    el.addEventListener("mouseup", cancel);
    el.addEventListener("mouseleave", cancel);
  }

          updateDoc(doc(db, "items", it.id), { repeatType: "interval", repeatDays: n > 0 ? n : 0 });
        };
        detailEl.appendChild(row);
      } else if (type === "weekly") {
        const row = document.createElement("div"); row.className = "weekday-row";

            b.classList.add("on");
            updateDoc(doc(db, "items", it.id), { repeatType: "weekly", repeatWeekday: w, repeatDays: 0, due: nextWeekday(w, todayISO()) });
          };
          row.appendChild(b);
        });
        detailEl.appendChild(row);
      } else if (type === "monthly") {
        const row = document.createElement("div"); row.className = "repeat-row";
        row.innerHTML = `On day <input type="number" min="1" max="31" inputmode="numeric" class="rep-input"> of each month`;
        const inp = row.querySelector(".rep-input");
        if (it.repeatDom) inp.value = it.repeatDom;
        inp.onchange = () => {
          let n = parseInt(inp.value, 10);
          if (!(n >= 1)) return;
          n = Math.min(31, n);
          it.repeatDom = n; it.repeatType = "monthly";
          updateDoc(doc(db, "items", it.id), { repeatType: "monthly", repeatDom: n, repeatDays: 0, due: nextDom(n, todayISO()) });
        };
        detailEl.appendChild(row);
      } else {
        detailEl.innerHTML = `<div class="rep-off">Doesn't repeat.</div>`;

    }

    [["", "Off"], ["interval", "Every N days"], ["weekly", "Weekly"], ["monthly", "Monthly"]].forEach(([val, label]) => {

    body.innerHTML = `<div class="text"><span class="tname"></span><span class="tqty"></span></div>`;
    body.querySelector(".tname").textContent = it.text;
    if (qty > 1) body.querySelector(".tqty").textContent = ` (${qty})`;

    if (!it.done) {
      // Tap: right half = more, left half = less (min 1). Long-press = options.
      body.classList.add("qty-tap");
      body.onclick = (e) => {
        const rect = body.getBoundingClientRect();
        const inc = (e.clientX - rect.left) > rect.width / 2 ? 1 : -1;
        updateDoc(doc(db, "items", it.id), { qty: Math.max(1, qty + inc) });
      };
      const store = it.store || "";
      const chip = document.createElement("button");
      chip.className = "store-chip" + (store ? "" : " empty");
      chip.textContent = store || "+ store";
      if (store) { chip.style.background = STORE_COLOR[store]; chip.style.color = "#fff"; chip.style.borderColor = "transparent"; }
      chip.onclick = () => updateDoc(doc(db, "items", it.id), { store: nextStore(store) });
      // Long-press a set store to filter the whole list by it
      if (store) {
        ["touchstart", "mousedown"].forEach((ev) => chip.addEventListener(ev, (e) => e.stopPropagation()));
        attachLongPress(chip, () => openStoreSheet(store));
      }
      el.querySelector(".row-actions").appendChild(chip);
    }

    attachLongPress(el, () => openSheet(it));
    if (it.photo) {
      const t = document.createElement("span");
      t.className = "gthumb";
      t.style.backgroundImage = `url("${it.photo}")`;
      el.insertBefore(t, body);
    }
    return el;
  }

  function suggestionChip(it) {
    const c = document.createElement("button");
    c.className = "schip";
    c.innerHTML = `<span class="sdot"></span><span class="stext"></span><span class="sx" aria-label="Remove">×</span>`;
    c.querySelector(".stext").textContent = it.text;
    c.querySelector(".sdot").style.background = it.store ? STORE_COLOR[it.store] : "var(--line)";
    c.onclick = () => updateDoc(doc(db, "items", it.id), { archived: false, done: false, createdAt: serverTimestamp() });
    c.querySelector(".sx").onclick = (e) => { e.stopPropagation(); deleteDoc(doc(db, "items", it.id)); };
    return c;
  }

  async function saveBought() {
    const batch = writeBatch(db);
    allItems.filter((i) => i.list === "groceries" && i.done && !i.archived)
            .forEach((i) => batch.update(doc(db, "items", i.id), { archived: true, done: false }));
    await batch.commit();
  }

  async function deleteMany(items) {
    const batch = writeBatch(db);
    items.forEach((i) => batch.delete(doc(db, "items", i.id)));
    await batch.commit();
  }

  /* ---------- Add ---------- */
  async function addItem() {
    const input = $("addInput");
    const text = input.value.trim();
    if (!text || !me) return;
    input.value = "";
    input.focus(); // keep keyboard up for rapid entry
    if (currentList === "recipes") {
      if (openRecipeId) {
        const r = allItems.find((i) => i.id === openRecipeId);
        const next = [...((r && r.ingredients) || []), text];
        await updateDoc(doc(db, "items", openRecipeId), { ingredients: next });
      } else {
        await addDoc(itemsCol, { text, list: "recipes", ingredients: [], addedBy: firstName(me), uid: me.uid, createdAt: serverTimestamp() });
      }
      return;
    }
    await addDoc(itemsCol, {
      text, list: currentList, done: false, archived: false, store: "", qty: 1,
      addedBy: firstName(me), uid: me.uid, createdAt: serverTimestamp()
    });
  }

  function updateAddPlaceholder() {
    const i = $("addInput");
    if (currentList === "tasks") i.placeholder = "Add a task…";
    else if (currentList === "recipes") i.placeholder = openRecipeId ? "Add an ingredient…" : "Add a recipe…";
    else i.placeholder = "Add an item…";
  }
  $("addBtn").onclick = addItem;
  $("addInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addItem(); } });

  /* ---------- Tabs ---------- */
  function switchTab(name) {
    currentList = name;
    storeFilter = null;
    openRecipeId = null;
    selectedIng = new Set();
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x.dataset.list === name));
    render();
    $("addInput").focus();
  }
  document.querySelectorAll(".tab").forEach((t) => { t.onclick = () => switchTab(t.dataset.list); });
</script>
</body>
</html>
